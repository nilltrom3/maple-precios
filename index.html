<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maple Precios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#f59e0b">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #14100c; color: #f5efe6; min-height: 100vh; padding: 16px; }
  header { text-align: center; margin: 8px 0 4px; }
  header h1 { font-size: 28px; } header h1 .leaf { font-size: 30px; }
  #updated { text-align: center; color: #b8a888; font-size: 13px; margin-bottom: 14px; }
  #mic { display: block; margin: 10px auto; width: 120px; height: 120px; border-radius: 50%; border: none;
         background: #f59e0b; font-size: 52px; cursor: pointer; box-shadow: 0 6px 24px rgba(245,158,11,.45); }
  #mic.listening { background: #dc2626; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  #status { text-align: center; min-height: 22px; color: #e7dcc4; margin: 6px 0 12px; }
  .row { display: flex; gap: 8px; max-width: 560px; margin: 0 auto; }
  #q { flex: 1; padding: 13px; font-size: 17px; border-radius: 10px; border: 1px solid #4a3d28; background: #221a12; color: #fff; }
  #go { padding: 13px 18px; font-size: 17px; border-radius: 10px; border: none; background: #f59e0b; color: #14100c; font-weight: 700; }
  #langRow { text-align: center; margin: 10px 0 2px; color: #b8a888; font-size: 13px; }
  select { background: #221a12; color: #fff; border: 1px solid #4a3d28; border-radius: 6px; padding: 4px; }
  #results { max-width: 560px; margin: 14px auto; display: grid; gap: 10px; }
  .card { background: #221a12; border: 1px solid #4a3d28; border-radius: 12px; padding: 14px; cursor: pointer; }
  .card h2 { font-size: 19px; margin-bottom: 4px; }
  .price { font-size: 26px; font-weight: 800; color: #fbbf24; }
  .sub { color: #b8a888; font-size: 13px; margin-top: 2px; }
  .up { color: #4ade80; } .down { color: #f87171; }
  .speak { float: right; background: none; border: none; font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<header><h1><span class="leaf">🍁</span> Maple Precios</h1></header>
<div id="updated">Cargando precios…</div>
<button id="mic" title="Preguntar por voz">🎤</button>
<div id="status">Toca el micrófono y di el nombre del ítem</div>
<div class="row">
  <input id="q" type="search" placeholder="O escribe el ítem… ej: Steely" autocomplete="off">
  <button id="go">Buscar</button>
</div>
<div id="langRow">Idioma del micrófono:
  <select id="micLang"><option value="en-US" selected>Inglés (nombres del juego)</option><option value="es-US">Español</option></select>
</div>
<div id="results"></div>
<script>
let ITEMS = [], UPDATED = null;
const $ = id => document.getElementById(id);
const fmt = n => n == null ? '—' : Math.round(n).toLocaleString('es');
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

async function load() {
  try {
    const r = await fetch('prices.json', {cache:'no-cache'});
    const d = await r.json();
    ITEMS = d.items; UPDATED = d.updated_at;
    localStorage.setItem('mp_prices', JSON.stringify(d));
  } catch(e) {
    const saved = localStorage.getItem('mp_prices');
    if (saved) { const d = JSON.parse(saved); ITEMS = d.items; UPDATED = d.updated_at; }
  }
  $('updated').textContent = ITEMS.length
    ? ITEMS.length.toLocaleString('es') + ' ítems · actualizado ' + new Date(UPDATED).toLocaleString('es')
    : 'Sin precios todavía';
}
function score(q, name) {
  const n = norm(name); if (!q) return 0;
  if (n === q) return 100;
  if (n.startsWith(q)) return 82;
  if (n.includes(q)) return 64;
  const qt = q.split(' '), nt = n.split(' ');
  let hit = 0; qt.forEach(t => { if (nt.some(x => x.startsWith(t))) hit++; });
  return hit ? 30 + 30*hit/qt.length : 0;
}
function search(query, limit=8) {
  const q = norm(query);
  return ITEMS.map(it => ({it, s: score(q, it.name)})).filter(x => x.s > 25)
    .sort((a,b) => b.s - a.s || (b.it.vol||0) - (a.it.vol||0)).slice(0, limit).map(x => x.it);
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-US'; u.rate = 1.02;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function answerText(it) {
  let t = it.name + '. Precio típico: ' + fmt(it.median) + ' mesos.';
  if (it.low != null && it.high != null && (it.low !== it.median || it.high !== it.median))
    t += ' El rango va de ' + fmt(it.low) + ' a ' + fmt(it.high) + '.';
  if (typeof it.chg === 'number' && it.chg !== 0)
    t += ' En 24 horas ' + (it.chg > 0 ? 'subió ' : 'bajó ') + Math.abs(it.chg).toString().replace('.', ',') + ' por ciento.';
  return t;
}
function show(list, query) {
  const box = $('results'); box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="card">No encontré ese ítem. Prueba con el nombre en inglés, como sale en el juego.</div>'; return; }
  list.forEach(it => {
    const d = document.createElement('div'); d.className = 'card';
    const chg = typeof it.chg === 'number'
      ? '<span class="' + (it.chg >= 0 ? 'up' : 'down') + '">' + (it.chg >= 0 ? '▲' : '▼') + ' ' + Math.abs(it.chg) + '% 24h</span>' : '';
    d.innerHTML = '<button class="speak" title="Escuchar">🔊</button><h2></h2><div class="price">' + fmt(it.median) + ' mesos</div>' +
      '<div class="sub">Rango típico: ' + fmt(it.low) + ' – ' + fmt(it.high) + ' · ' + chg + '</div>' +
      '<div class="sub">Visto: ' + (it.seen || '—') + (it.level ? ' · Nivel ' + it.level : '') + (it.classes ? ' · ' + it.classes : '') + '</div>';
    d.querySelector('h2').textContent = it.name;
    d.querySelector('.speak').onclick = e => { e.stopPropagation(); speak(answerText(it)); };
    d.onclick = () => speak(answerText(it));
    box.appendChild(d);
  });
}
function doSearch(q) {
  const list = search(q);
  show(list, q);
  return list;
}
$('go').onclick = () => doSearch($('q').value);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch($('q').value); });
$('q').addEventListener('input', () => { const v = $('q').value; if (v.length >= 3) show(search(v), v); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$('mic').onclick = () => {
  if (!SR) { $('status').textContent = 'Este navegador no soporta voz; escribe el ítem arriba.'; return; }
  const rec = new SR();
  rec.lang = $('micLang').value; rec.interimResults = false; rec.maxAlternatives = 3;
  $('mic').classList.add('listening'); $('status').textContent = 'Escuchando… di el nombre del ítem';
  rec.onresult = e => {
    const alts = [...e.results[0]].map(a => a.transcript);
    let best = [], bestText = alts[0];
    for (const t of alts) { const l = search(t); if (l.length > best.length || (l.length && best.length && score(norm(t), l[0].name) > score(norm(bestText), best[0].name))) { best = l; bestText = t; } }
    $('q').value = bestText;
    $('status').textContent = 'Entendí: «' + bestText + '»';
    if (best.length) { show(best, bestText); speak(answerText(best[0])); }
    else show([], bestText);
  };
  rec.onerror = e => { $('status').textContent = 'No te escuché bien, toca de nuevo.'; };
  rec.onend = () => $('mic').classList.remove('listening');
  rec.start();
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
load();
</script>
</body>
</html>
